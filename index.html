  <div class="stage" id="stg" data-a="stageTap"></div><div id="cap" aria-live="polite"></div>
  <div class="pctrl"><button class="icon-btn glass" data-a="spPrev" aria-label="Cena anterior">${I("skip-back")}</button><button class="icon-btn glass big" data-a="spPlay" aria-label="Pausar">${I("pause")}</button><button class="icon-btn glass" data-a="spNext" aria-label="Próxima cena">${I("skip-forward")}</button></div>
  <div class="pctrl" style="padding-top:0"><button class="pill-tog" data-a="spNarr" aria-pressed="${SP.narr}">${I("voice")}Narração</button><button class="pill-tog" data-a="spMusic" aria-pressed="${SP.music}">${I("music")}Trilha</button><button class="pill-tog" data-a="spListen" aria-pressed="${SP.listen}">${I("moon")}Só ouvir</button><button class="pill-tog" data-a="spVoice" aria-label="Escolher voz">${I("tune")}</button></div></div>`;
 showScene(0)}
function speakAll(text,tok,done){const sents=text.match(/[^.!?…]+[.!?…]*["”]?/g)||[text];let k=0;const v=bestVoice();
 const next=()=>{if(tok!==SP.token)return;if(k>=sents.length){done();return}const u=new SpeechSynthesisUtterance(sents[k++].trim());u.lang="pt-BR";u.rate=NARR.rate;u.pitch=NARR.pitch;if(v)u.voice=v;
  u.onend=()=>setTimeout(next,380);u.onerror=()=>setTimeout(next,380);speechSynthesis.speak(u)};next()}
function showScene(i){const st=SP.st;SP.i=i;clearTimeout(SP.t);try{speechSynthesis.cancel()}catch(e){}const tok=++SP.token;
 const segs=[...document.querySelectorAll(".segs i")];segs.forEach((s,k)=>{s.className=k<i?"past":"";const b=s.firstChild;b.getAnimations().forEach(a=>a.cancel());b.style.width=k<i?"100%":"0"});
 const stg=$("#stg");const put=html=>{const d=document.createElement("div");d.className="scene";d.innerHTML=html;stg.appendChild(d);const old=[...stg.children].slice(0,-1);setTimeout(()=>old.forEach(o=>o.remove()),900)};
 if(i>=st.scenes.length){put(sceneSVG({set:"estrelas",a:"💜:180:150:90:g",tx:"Fim"}));
  $("#cap").innerHTML=`<p class="cap">Fim. Que história bonita! 💜</p><div class="row" style="justify-content:center;gap:10px;margin-top:6px"><button class="btn sm ghost" data-a="spAgain">Ouvir de novo</button><button class="btn sm" data-a="spNextStory">Próxima história</button></div>`;
  if(!st._done){st._done=true;S.stats.stories++;giveXP(15,"História concluída 📖");confetti(30)}return}
 const sc=st.scenes[i];put(sceneSVG(sc));$("#cap").innerHTML=`<p class="cap" key="${i}">${sc.tx}</p>`;
 if(!SP.playing)return;const est=words(sc.tx)*(SP.narr?470:380)+2400;
 segs[i].firstChild.animate([{width:"0"},{width:"100%"}],{duration:est,fill:"forwards"});
 const adv=()=>{if(tok===SP.token&&SP.playing)showScene(i+1)};
 if(SP.narr&&"speechSynthesis"in window){SP.t=setTimeout(adv,est+6000);speakAll(sc.tx,tok,()=>{clearTimeout(SP.t);SP.t=setTimeout(adv,1300)})}else SP.t=setTimeout(adv,est)}
function closeOv(){clearTimeout(SP.t);SP.token++;try{speechSynthesis.cancel()}catch(e){}if(AE.bg)AE.close();$("#ov").innerHTML="";S.overlay=null;renderMini()}
function nightMode(){S.overlay="night";$("#ov").innerHTML=`<div class="nightmode" data-a="closeOv" role="dialog" aria-label="Tela noturna"><div class="moon"></div><p style="font-weight:800">${AE.cur?AE.cur.t:"Silêncio"}</p><p class="small" data-timer></p><p class="small" style="margin-top:30px;opacity:.6">Toque para sair</p></div>`}
function voiceSheet(){const vs=ptVoices();return `<div class="scrim" data-a="close" style="z-index:90"></div><div class="sheet" style="z-index:91" role="dialog" aria-modal="true" aria-labelledby="vz"><div class="grip"></div><h2 id="vz">Voz do narrador</h2><p class="small muted" style="margin:6px 0 14px">As vozes vêm do seu aparelho. As marcadas como naturais soam mais suaves.</p>
 ${vs.length?`<div class="stack">${vs.map(v=>`<button class="opt" data-a="pickVoice" data-k="${v.name.replace(/"/g,"")}" aria-pressed="${(bestVoice()||{}).name===v.name}"><span class="check">${I("check")}</span><span style="flex:1">${v.name}<span class="small muted" style="display:block">${v.lang}</span></span></button>`).join("")}</div>`:`<p class="muted">Nenhuma voz em português encontrada neste aparelho. No app instalado, a narração é gravada em estúdio.</p>`}
 <label class="field" style="margin-top:16px"><span>Velocidade</span><input type="range" min=".6" max="1.1" step=".02" value="${NARR.rate}" data-a="rate" style="background:var(--lav-soft)"></label></div>`}

 <p class="small muted" style="margin-top:12px">Recontos originais, em linguagem simples para crianças pequenas.</p></div>`}

const secH=(t,right="")=>`<div class="sec-h rise"><h2>${t}</h2>${right}</div>`;
function currentStage(){const d=ageDays();let c=STAGES[0];STAGES.forEach(s=>{if(d>=s.d)c=s});return c}
function vaxStatus(i,d){if(S.vax[i])return S.vax[i].st;return VACCINES[i].age<=d?"pendente":"futura"}
function nextVax(){const d=ageDays();return VACCINES.map((v,i)=>({...v,i,st:vaxStatus(i,d)})).find(v=>v.st!=="aplicada")}
function nextEvent(){return S.events.filter(e=>e.at>=new Date()).sort((a,b)=>a.at-b.at)[0]}

 <div class="sec">${secH("Para esta fase")}

 <div class="sec">${secH("Você")}

function agenda(){if(S.sub==="novoEvento")return novoEvento();const t=today(),y=t.getFullYear(),m=t.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),sel=S.selDay||t.getDate();
 const has=d=>S.events.some(e=>e.at.getMonth()===m&&e.at.getFullYear()===y&&e.at.getDate()===d);const list=S.events.slice().sort((a,b)=>a.at-b.at);

function lineChart(pts,key,unit,color){if(pts.length<2)return `<p class="small muted">Registre pelo menos duas medidas para ver o gráfico.</p>`;
 const W=320,H=150,p=28,xs=pts.map(x=>+x.d),ys=pts.map(x=>x[key]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)*.95,y1=Math.max(...ys)*1.03;
 const X=v=>p+(v-x0)/(x1-x0||1)*(W-p*1.5),Y=v=>H-p+ -(v-y0)/(y1-y0||1)*(H-p*1.6);const d=pts.map((q,i)=>`${i?"L":"M"}${X(+q.d).toFixed(1)} ${Y(q[key]).toFixed(1)}`).join(" ");
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${unit}" style="width:100%;height:auto;overflow:visible"><defs><linearGradient id="g${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
 ${[0,.5,1].map(f=>`<line x1="${p}" x2="${W-p/2}" y1="${Y(y0+(y1-y0)*f)}" y2="${Y(y0+(y1-y0)*f)}" stroke="var(--border)"/><text x="${p-6}" y="${Y(y0+(y1-y0)*f)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${(y0+(y1-y0)*f).toFixed(1).replace(".",",")}</text>`).join("")}
 <path d="${d} L${X(x1)} ${H-p} L${X(x0)} ${H-p}Z" fill="url(#g${key})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="draw" pathLength="1"/>
 ${pts.map(q=>`<circle cx="${X(+q.d)}" cy="${Y(q[key])}" r="4.5" fill="var(--card)" stroke="${color}" stroke-width="2.5"/><text x="${X(+q.d)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${fmtD(q.d)}</text>`).join("")}</svg>`}

function renderApp(){const app=$("#app"),r=route(),changed=r!==S._route,isSub=!!S.sub&&S._route.split("/")[0]===S.tab;
 if(S.screen==="onboard"){app.innerHTML=onboard();$("#nav").hidden=true;$("#mini").innerHTML="";after(changed);S._route=r;return}
 const map={vacinas,meds,sono,dentes,docs,diario,sintomas,arvore,agenda,novoEvento:agenda,biblioteca,crescimento,descobertas,novoMed,perfil};
 let body;const sub=S.sub||"";
 if(sub.startsWith("artigo:"))body=artigo(sub.slice(7));else if(sub.startsWith("guia:"))body=guia(sub.slice(5));
 else if(map[sub])body=map[sub]();else body={hoje,jornada,ninar,bebe}[S.tab]();
 app.innerHTML=`<main class="page ${changed?(isSub&&S.sub?"enter-sub":"enter"):""}">${body}</main>`;
 renderNav();renderMini();renderSheet();S._route=r;after(changed);afterExtra()}
function afterExtra(){const q=$("#q");if(q){q.oninput=()=>{S.q=q.value;const p=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
 const num=v=>v?+String(v).replace(",","."):null;
 const gf=$("#growthForm");if(gf)gf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(gf));const w=num(d.w),h=num(d.h),hc=num(d.hc);
  if(!d.d||(!w&&!h&&!hc)){$("#gerr").textContent="Informe a data e pelo menos uma medida.";return}if((w&&(w<.5||w>40))||(h&&(h<30||h>130))){$("#gerr").textContent="Confira os valores: peso em kg e altura em cm.";return}
  (S.growth=S.growth||[]).push({d:new Date(d.d+"T00:00"),w,h,hc});render();giveXP(10,"Medida registrada 📏")};
 const mf=$("#medForm");if(mf)mf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(mf));const times=(d.times||"").split(",").map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}$/.test(x));
  if(!d.name.trim()||!d.dose.trim()||!times.length){$("#merr").textContent="Preencha nome, dose informada e ao menos um horário no formato 08:00.";return}
  if(!d.ok){$("#merr").textContent="Confirme que as informações vêm de um profissional de saúde.";return}
  S.meds.push({name:d.name.trim(),dose:d.dose.trim(),unit:d.unit,times,by:d.by});S.sub="meds";render();giveXP(10,"Medicamento salvo. Lembretes criados 💊")};
 const pf=$("#profForm");if(pf)pf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(pf));if(d.user.trim())S.user.name=d.user.trim();if(d.name.trim())S.baby.name=d.name.trim();Object.assign(S.baby,{nick:d.nick,blood:d.blood,plan:d.plan,ped:d.ped,all:d.all,emg:d.emg});S.sub=null;render();toast("Perfil salvo")}}

let deferredInstall=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,k=el.dataset.k;
 switch(a){
  case"storyCat":S.storyCat=k;render();break;
  case"trackF":S.trackF=k;render();break;
  case"spMusic":SP.music=!SP.music;el.setAttribute("aria-pressed",SP.music);if(SP.music)AE.play(TRACKS.find(t=>t.id==="silencio"),{bg:true,g:.2});else if(AE.bg)AE.close();break;
  case"spVoice":S.sheet="voice";renderSheet();break;
  case"pickVoice":NARR.voice=k;renderSheet();toast("Voz escolhida");break;
  case"spNextStory":{const vis=STORIES.filter(s=>!s.premium||S.premium),i=vis.findIndex(s=>s.id===SP.st.id);closeOv();openStory(vis[(i+1)%vis.length].id);break}
  case"sleepHelp":S.sleepHelp=S.sleepHelp===k?null:k;render();break;
  case"bedtime":{const b=S.bedtime=S.bedtime||[],i=+el.dataset.i,was=b.includes(i);was?b.splice(b.indexOf(i),1):(b.push(i),giveXP(3));if(b.length===BEDTIME.length){toast("Tudo pronto para dormir 🌙");if(!S.sleepActive)S.sleepActive=Date.now()}render();break}
  case"milestone":{(S.milestones=S.milestones||{})[k]=today();const m=MILESTONES.find(x=>x[0]===k);render();giveXP(25,`${m[1]}! ${m[2]}`);confetti(50);break}
  case"install":if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else toast("No celular: menu do navegador → Adicionar à tela inicial");break;
 }});
document.addEventListener("input",e=>{if(e.target.dataset.a==="rate")NARR.rate=+e.target.value});
const msTry=()=>{try{document.fonts.load('24px "Material Symbols Rounded"',"check").then(f=>{if(f&&f.length)document.documentElement.classList.add("ms-ok")}).catch(()=>{})}catch(e){}};
addEventListener("load",msTry);msTry();setTimeout(msTry,1500);setTimeout(msTry,4000);

/* ================= PRODUÇÃO: conta, nuvem e assinatura ================= */
const CONFIG=window.NINHO_CONFIG||{};
const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const AUTH={ready:false,user:null,mode:new URLSearchParams(location.search).has("cadastro")?"criar":"entrar",recovery:false,busy:false,sub:null};
const PERSIST=["screen","step","user","baby","goals","xp","done","stageDone","mood","events","meds","medLog","sleep","sleepActive","vax","teeth","docs","memories","growth","milestones","favs","treeTheme","stats","bedtime","lastStory","ninar"];
const ser=()=>{const o={};PERSIST.forEach(k=>o[k]=S[k]);return JSON.stringify(o,function(k,v){const r=this[k];if(r instanceof Date)return{__d:r.toISOString()};if(r instanceof Set)return{__s:[...r]};return v})};
const deser=t=>JSON.parse(t,(k,v)=>v&&typeof v==="object"?(v.__d?new Date(v.__d):v.__s?new Set(v.__s):v):v);
const INITIAL_STR=ser();
const lsKey=()=>`ninho:${AUTH.user.id}`;
let saveT=null,lastSaved="";
function scheduleSave(){if(!AUTH.user||S.screen!=="app")return;clearTimeout(saveT);saveT=setTimeout(saveNow,1500)}
async function saveNow(){const d=ser();if(d===lastSaved)return;try{localStorage.setItem(lsKey(),d)}catch(e){}
 const{error}=await sb.from("app_state").upsert({user_id:AUTH.user.id,data:JSON.parse(d)});if(!error)lastSaved=d}
addEventListener("pagehide",()=>{if(AUTH.user&&S.screen==="app")saveNow()});
async function loadState(){let d=null;const{data}=await sb.from("app_state").select("data").eq("user_id",AUTH.user.id).maybeSingle();
 if(data&&data.data&&Object.keys(data.data).length)d=JSON.stringify(data.data);else{try{d=localStorage.getItem(lsKey())}catch(e){}}
 Object.assign(S,deser(INITIAL_STR));
 if(d){Object.assign(S,deser(d));lastSaved=d}
 if(!S.user.name){const n=(AUTH.user.user_metadata||{}).name;if(n)S.user.name=n}
 S.tab="hoje";S.sub=null;S.sheet=null;S._route="";S._tree=null}
async function refreshSub(show){const{data,error}=await sb.rpc("my_subscription");if(error)return;AUTH.sub=data;const was=S.premium;S.premium=!!data.premium;
 if(show)toast(S.premium?"Ninho+ ativo 👑":"Ainda não encontramos o pagamento. Pode levar alguns minutos.");
 if(!was&&S.premium&&AUTH.ready){confetti(70)}if(AUTH.ready&&AUTH.user)render()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&AUTH.user)refreshSub(false)});

sb.auth.onAuthStateChange(async(ev,session)=>{
 if(ev==="PASSWORD_RECOVERY"){AUTH.recovery=true;AUTH.user=session&&session.user;AUTH.ready=true;render();return}
 const u=session?session.user:null;if((u&&u.id)===(AUTH.user&&AUTH.user.id)&&AUTH.ready)return;
 AUTH.user=u;if(u){setTimeout(async()=>{try{await loadState();await refreshSub(false)}catch(e){console.error(e)}finally{AUTH.ready=true;render()}},0);return}AUTH.ready=true;render()});setTimeout(()=>{if(!AUTH.ready){AUTH.ready=true;render()}},8000);

function authScreen(){const m=AUTH.mode,rec=AUTH.recovery;
 return `<main class="onb"><div style="text-align:center;margin-top:12px"><img class="logo-float" src="${LOGO}" alt="" width="120" height="120" style="border-radius:32px;display:block;margin:0 auto 14px"><h1 style="font-size:2.1rem;color:var(--lil-ink)">Ninho</h1><p class="muted">Sua jornada com o bebê</p></div>
 ${rec?`<form id="authForm" class="stack" style="margin-top:26px" novalidate><h2>Crie uma nova senha</h2><label class="field"><span>Nova senha</span><input name="pass" type="password" autocomplete="new-password" minlength="8" required></label><p id="aerr" class="small" role="alert" style="color:var(--danger)"></p><button class="btn" type="submit">Salvar nova senha</button></form>`:
 `<div class="seg" role="tablist" style="margin-top:26px">${[["entrar","Entrar"],["criar","Criar conta"]].map(([k,l])=>`<button role="tab" data-a="authMode" data-k="${k}" aria-selected="${m===k}">${l}</button>`).join("")}</div>
 <form id="authForm" class="stack" style="margin-top:16px" novalidate>
 ${m==="criar"?`<label class="field"><span>Seu nome</span><input name="name" autocomplete="given-name" maxlength="80" required></label>`:""}
 <label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="email" required></label>
 ${m!=="recuperar"?`<label class="field"><span>Senha</span><input name="pass" type="password" autocomplete="${m==="criar"?"new-password":"current-password"}" minlength="8" required></label>`:""}
 ${m==="criar"?`<label class="opt" style="align-items:flex-start"><input type="checkbox" name="terms" style="width:22px;height:22px;accent-color:var(--lil);flex-shrink:0"> <span class="small">Li e aceito os <a href="/termos.html" target="_blank">Termos de uso</a> e a <a href="/privacidade.html" target="_blank">Política de privacidade</a>, inclusive o tratamento dos dados de saúde do meu bebê para o funcionamento do app.</span></label>`:""}
 <p id="aerr" class="small" role="alert" style="color:var(--danger)"></p>
 <button class="btn" type="submit">${m==="criar"?"Criar minha conta":m==="recuperar"?"Enviar link de recuperação":"Entrar"}</button>
 ${m==="entrar"?`<button class="btn text" type="button" data-a="authMode" data-k="recuperar">Esqueci minha senha</button>`:m==="recuperar"?`<button class="btn text" type="button" data-a="authMode" data-k="entrar">Voltar para entrar</button>`:""}
 </form>`}
 <p class="small muted" style="text-align:center;margin-top:18px">O Ninho não substitui o acompanhamento com profissionais de saúde.</p></main>`}
function bindAuth(){const f=$("#authForm");if(!f)return;f.onsubmit=async e=>{e.preventDefault();if(AUTH.busy)return;const d=Object.fromEntries(new FormData(f)),err=$("#aerr"),btn=f.querySelector('button[type=submit]');
 const fail=m=>{err.textContent=m;AUTH.busy=false;btn.disabled=false};
 const email=(d.email||"").trim();
 if(AUTH.recovery){if((d.pass||"").length<8)return fail("A senha precisa ter pelo menos 8 caracteres.");AUTH.busy=true;btn.disabled=true;const{error}=await sb.auth.updateUser({password:d.pass});if(error)return fail("Não foi possível salvar. Tente de novo.");AUTH.recovery=false;AUTH.busy=false;toast("Senha atualizada");location.hash="";render();return}
 if(!/^\S+@\S+\.\S+$/.test(email))return fail("Digite um e-mail válido.");
 if(AUTH.mode==="recuperar"){AUTH.busy=true;btn.disabled=true;await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});AUTH.busy=false;btn.disabled=false;err.style.color="var(--mint-ink,#2F8A5B)";err.textContent="Se esse e-mail tiver conta, enviamos um link para criar uma nova senha.";return}
 if((d.pass||"").length<8)return fail("A senha precisa ter pelo menos 8 caracteres.");
 if(AUTH.mode==="criar"){if(!(d.name||"").trim())return fail("Conte como você gostaria de ser chamada.");if(!d.terms)return fail("Para continuar, aceite os termos e a política de privacidade.");
  AUTH.busy=true;btn.disabled=true;const{data,error}=await sb.auth.signUp({email,password:d.pass,options:{data:{name:d.name.trim()},emailRedirectTo:location.origin+location.pathname}});
  if(error)return fail(/registered|already/i.test(error.message)?"Esse e-mail já tem conta. Use Entrar.":"Não foi possível criar a conta agora. Tente de novo.");
  AUTH.busy=false;
  if(data.user&&!data.session){err.style.color="var(--text)";err.innerHTML="<b>Quase lá!</b> Enviamos um e-mail de confirmação. Abra o link e depois entre aqui.";btn.disabled=false;return}
  if(data.user)sb.from("consents").insert([{user_id:data.user.id,kind:"termos",document_version:"2026-09",granted:true},{user_id:data.user.id,kind:"privacidade",document_version:"2026-09",granted:true},{user_id:data.user.id,kind:"dados_saude_crianca",document_version:"2026-09",granted:true}]).then(()=>{});
  return}
 AUTH.busy=true;btn.disabled=true;const{error}=await sb.auth.signInWithPassword({email,password:d.pass});
 if(error)return fail(/confirm/i.test(error.message)?"Confirme seu e-mail pelo link que enviamos antes de entrar.":"E-mail ou senha incorretos.");AUTH.busy=false}}

function render(){const app=$("#app");
 if(!AUTH.ready){app.innerHTML=`<main class="onb" style="display:grid;place-items:center;min-height:100vh"><img class="logo-float" src="${LOGO}" alt="Carregando o Ninho" width="110" height="110" style="border-radius:30px"></main>`;$("#nav").hidden=true;return}
 if(!AUTH.user||AUTH.recovery){app.innerHTML=authScreen();$("#nav").hidden=true;$("#mini").innerHTML="";$("#sheet").innerHTML="";bindAuth();return}
 renderApp();scheduleSave()}

function paySheet(){const nPrem=STORIES.filter(s=>s.premium).length,nAud=ALL.filter(t=>t.premium).length,email=AUTH.user?AUTH.user.email:"";
 const perks=[["church",`${nPrem} histórias bíblicas exclusivas`,"narradas, com cenas animadas e modo Só ouvir"],["music",`${nAud} canções e sons exclusivos`,"caixinha, harpa, flauta, chuva, útero, lareira…"],["palette","Temas para a Árvore da Jornada","cerejeira, ipê amarelo, jardim da lua"],["book-image","Álbum do primeiro ano","suas memórias organizadas"],["users","Família no mesmo plano","em breve"]];
 if(S.premium){const exp=AUTH.sub&&AUTH.sub.expires_at?new Date(AUTH.sub.expires_at).toLocaleDateString("pt-BR"):null;
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Ninho+"><div class="grip"></div><div class="paywall-h"><div class="crown">${I("crown")}</div><h2>Você é Ninho+ 💛</h2><p class="muted small" style="margin-top:6px">${exp?`Acesso garantido até ${exp}. A renovação é mensal e automática.`:"Tudo desbloqueado."}</p></div>
  <p class="small muted" style="text-align:center">Para cancelar ou trocar o cartão, use o link do e-mail de compra da Cakto${CONFIG.SUPORTE?` ou escreva para <a href="mailto:${CONFIG.SUPORTE}">${CONFIG.SUPORTE}</a>`:""}.</p></div>`}
 return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pw"><div class="grip"></div>
 <div class="paywall-h"><div class="crown">${I("crown")}</div><h2 id="pw">Ninho+</h2><p class="muted small" style="margin-top:6px">${payReason||"Mais carinho para a sua jornada"}</p></div>
 <div class="stack">${perks.map(([i,t,s],k)=>`<div class="row rise" style="--i:${k}">${badge(i,"--sun-soft")}<div><b>${t}</b><p class="small muted">${s}</p></div></div>`).join("")}</div>
 <div class="plan" aria-pressed="true" style="margin-top:20px;cursor:default"><span style="flex:1"><b>Mensal</b><span class="small muted" style="display:block">cancele quando quiser</span></span><b style="white-space:nowrap">R$ 19,90/mês</b></div>
 <button class="btn gold" style="margin-top:16px" data-a="checkout">Assinar agora</button>
 <button class="btn ghost" style="margin-top:8px" data-a="refreshSub">Já assinei — atualizar</button>
 <p class="small muted" style="text-align:center;margin-top:12px">Pagamento seguro pela Cakto (Pix ou cartão). <b>Use o mesmo e-mail da sua conta: ${email}</b>. Vacinas, medicamentos, agenda, documentos e alertas de saúde são sempre gratuitos.</p></div>`}

function downloadJSON(obj,name){const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ações de produção — capturadas antes dos manipuladores do protótipo */
addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,k=el.dataset.k;
 const stop=()=>{e.stopImmediatePropagation();e.preventDefault()};
 switch(a){
  case"authMode":stop();AUTH.mode=k;render();break;
  case"checkout":stop();if(!CONFIG.CAKTO_CHECKOUT_MENSAL){toast("O checkout ainda está sendo configurado.");break}
   window.open(CONFIG.CAKTO_CHECKOUT_MENSAL,"_blank","noopener");toast("Depois de pagar, volte aqui e toque em “Já assinei”");break;
  case"refreshSub":stop();await refreshSub(true);if(S.premium){S.sheet="premium";renderSheet()}break;
  case"subscribe":case"unsub":case"demo":stop();break;
  case"logout":stop();await saveNow();await sb.auth.signOut();try{localStorage.removeItem(lsKey())}catch(x){}location.reload();break;
  case"export":stop();{const{data,error}=await sb.rpc("export_my_data");if(error){toast("Não foi possível exportar agora");break}downloadJSON(data,`ninho-meus-dados-${new Date().toISOString().slice(0,10)}.json`);toast("Seus dados foram baixados")}break;
  case"legal":stop();window.open("/privacidade.html","_blank","noopener");break;
  case"delete":stop();{const ok=confirm("Excluir sua conta apaga todos os dados do Ninho e não pode ser desfeito. A assinatura na Cakto deve ser cancelada separadamente. Deseja continuar?");if(!ok)break;
   const t=prompt("Para confirmar, digite EXCLUIR");if((t||"").trim().toUpperCase()!=="EXCLUIR")break;
   const{error}=await sb.functions.invoke("delete-account",{method:"POST"});if(error){toast("Não foi possível excluir agora. Tente de novo.");break}
   try{localStorage.removeItem(lsKey())}catch(x){}await sb.auth.signOut();alert("Sua conta e seus dados foram excluídos.");location.reload()}break;
 }},true);

if("serviceWorker"in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

try{speechSynthesis.getVoices()}catch(e){}
render();
</script>
